name: Self audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run local GitHub Action
        id: guard
        uses: ./
        with:
          fail-on: warn
      - name: Verify action outputs
        env:
          ERRORS: ${{ steps.guard.outputs.errors }}
          WARNINGS: ${{ steps.guard.outputs.warnings }}
          FINDINGS: ${{ steps.guard.outputs.findings }}
        run: |
          test "$ERRORS" = 0
          test "$WARNINGS" = 0
          test -n "$FINDINGS"
